name: main
on:
  workflow_dispatch:
  push:
    branches:
    - 'main'
  pull_request:
    types: [opened, edited, synchronize, reopened]


jobs:
  build-static-test:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.27.3
    - name: Build
      run: make build
    - name: FMT
      run: make fmt
    - name: VET
      run: make vet
    - name: LINT
      run: make lint
      env:
        LINT: true
  build-ut:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.27.3
    - name: ut
      run: make test
      env:
        UT: true
  FV:
    runs-on: ubuntu-24.04
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.27.3
    - name: fv
      run: make create-cluster fv
      env:
        FV: true
  NEW_FV:
    runs-on: ubuntu-24.04
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.27.3
    - name: fv
      run: make create-cluster new-fv
      env:
        FV: true
  FV_SHARDING:
    runs-on: ubuntu-24.04
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.27.3
    - name: fv-sharding
      run: make create-cluster fv-sharding
      env:
        FV: true
  FV_AGENTLESS:
    runs-on: ubuntu-24.04
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.27.3
    - name: fv-agentless
      run: make create-cluster fv-agentless
      env:
        FV: true
  FV_OIDC:
    runs-on: ubuntu-24.04
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.27.3
    - name: fv-oidc
      run: make create-cluster create-cluster-oidc fv-oidc
      env:
        FV: true
  FV_PULLMODE:
    runs-on: ubuntu-24.04
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.27.3
    - name: fv-pullmode
      run: make create-cluster-pullmode fv-pullmode
      env:
        FV: true
  NEW_FV_PULLMODE:
    runs-on: ubuntu-24.04
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.27.3
    - name: new-fv-pullmode
      run: make create-cluster-pullmode new-fv-pullmode
      env:
        FV: true
  FV-NAMESPACE:
    runs-on: ubuntu-24.04
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.27.3
    - name: fv
      run: make create-cluster-infra fv-namespace
      env:
        FV: true
  FV_AGENTLESS_GROUPING:
    # Post-merge only: the job needs the license in SVELTOS_FV_LICENSE, and environment secrets
    # are never released to pull_request runs from a fork, so on a PR it would just fail.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Required so the SVELTOS_FV_LICENSE environment secret (below) is injected into this job.
    environment: SVELTOS_FV_LICENSE
    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 1.27.3
    - name: fv-agentless-grouping
      run: make create-cluster-agentless-grouping fv-agentless-grouping
      env:
        FV: true
        SVELTOS_FV_LICENSE: ${{ secrets.SVELTOS_FV_LICENSE }}
