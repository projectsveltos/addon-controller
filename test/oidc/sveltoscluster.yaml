# The SveltosCluster the OIDC FV test targets: same physical cluster as
# test/clusterapi-workload.yaml, registered separately with OIDC workload identity
# instead of a kubeconfig Secret, exactly like a real on-prem/self-managed customer
# cluster fronted by an enterprise IdP (Dex, Keycloak, Okta) would be.
apiVersion: v1
kind: Namespace
metadata:
  name: oidc-test
---
apiVersion: v1
kind: Secret
metadata:
  name: oidc-workload-creds
  namespace: oidc-test
type: Opaque
stringData:
  client_id: ${OIDC_CLIENT_ID}
  client_secret: ${OIDC_CLIENT_SECRET}
---
apiVersion: v1
kind: Secret
metadata:
  name: oidc-idp-ca
  namespace: oidc-test
type: Opaque
data:
  ca.crt: ${DEX_CA_B64}
---
apiVersion: v1
kind: Secret
metadata:
  name: oidc-workload-apiserver-ca
  namespace: oidc-test
type: Opaque
data:
  ca.crt: ${WORKLOAD_APISERVER_CA_B64}
---
apiVersion: lib.projectsveltos.io/v1beta1
kind: SveltosCluster
metadata:
  name: oidc-workload
  namespace: oidc-test
spec:
  workloadIdentity:
    provider: OIDC
    endpoint: ${WORKLOAD_ENDPOINT}
    caSecretRef:
      name: oidc-workload-apiserver-ca
    oidc:
      tokenURL: ${DEX_ISSUER_URL}/token
      secretRef:
        name: oidc-workload-creds
      caSecretRef:
        name: oidc-idp-ca
