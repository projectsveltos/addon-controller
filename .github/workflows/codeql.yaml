name: CodeQL
on:
  push:
    branches:
    - 'main'
  pull_request:
    branches:
    - 'main'
  schedule:
  - cron: '21 3 * * 3'

permissions: read-all

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ['go']

    steps:
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: 1.27.4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        languages: ${{ matrix.language }}

    - name: Build
      # Autobuild's heuristic only traced a fraction of the module (79 of 189 files per the
      # code-scanning diagnostic). Build the whole module explicitly so CodeQL sees every package.
      run: go build ./...

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        category: "/language:${{ matrix.language }}"
